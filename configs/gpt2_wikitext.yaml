model:
  name: "gpt2"
  vocab_size: 50257
  n_positions: 1024
  n_embd: 768
  n_layer: 12
  n_head: 12

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 3.0e-4
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 5000
  max_grad_norm: 1.0
  mixed_precision: "fp16"

data:
  dataset: "wikitext"
  dataset_config: "wikitext-103-raw-v1"
  seq_length: 128
  num_workers: 0

checkpoint:
  save_dir: "./checkpoints"
  save_every_n_steps: 500
  keep_last_n: 3

logging:
  log_every_n_steps: 10
  wandb_project: "distributed-ml-orchestrator"